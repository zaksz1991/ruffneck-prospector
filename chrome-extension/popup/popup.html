<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 16px;
    }
    h1 { font-size: 16px; margin-bottom: 4px; }
    h1 span { color: #60a5fa; }
    .sub { font-size: 11px; color: #94a3b8; margin-bottom: 14px; }
    label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
    input, select {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #e2e8f0;
      padding: 8px 10px;
      font-size: 13px;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: #334155; margin-top: 8px; }
    .status {
      margin-top: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }
    .status.ok { display: block; background: #064e3b; color: #6ee7b7; }
    .status.err { display: block; background: #7f1d1d; color: #fca5a5; }
    .page-type {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      background: #1e293b;
      display: inline-block;
      margin-bottom: 12px;
      color: #94a3b8;
    }
    .page-type.active { background: #1e3a5f; color: #93c5fd; }
  </style>
</head>
<body>
  <h1>RuffNeck <span>Capture</span></h1>
  <p class="sub">Send current page into your Prospector</p>

  <div id="pageType" class="page-type">Detecting page…</div>

  <label>API Base URL</label>
  <input id="apiUrl" type="text" placeholder="http://localhost:8000" />

  <label>Workspace ID (optional)</label>
  <input id="workspaceId" type="text" placeholder="Leave empty for default" />

  <button id="captureBtn">Capture to RuffNeck</button>
  <button id="saveSettings" class="secondary">Save Settings</button>

  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
